# Composer Shared Metadata Repository Publisher v1.0.2 (2026-10-19)
# Publishes only the Linux x64 build for the Version in the checked-out .csproj.
# Prevents fallback to a previously successful version's artifact/release.
# Safe: never modifies Jellyfin config or SQLite. Existing GitHub Release
# assets are checksum-verified and are never overwritten.
# Manual workflow only; GITHUB_TOKEN requires contents:write, actions:read.
name: Publish Composer repository manifest

on:
  workflow_dispatch:
    inputs:
      build_run_id:
        description: 'Optional successful matching Build native Composer plugin run ID'
        required: false
        type: string
      release_tag:
        description: 'Optional release tag; must match plugin .csproj (e.g. v1.2.2)'
        required: false
        type: string

permissions:
  actions: read
  contents: write

concurrency:
  group: composer-linux-x64-catalog
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out default branch
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Lock publishing to the current plugin version
        id: expected
        shell: bash
        env:
          INPUT_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          python3 tools/select_composer_build.py \
            --project plugin/Jellyfin.Plugin.ComposerSharedMetadata.csproj \
            --release-tag "$INPUT_TAG" --github-output "$GITHUB_OUTPUT" --apply

      - name: Find and download matching successful build artifact
        id: fetch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          INPUT_RUN_ID: ${{ inputs.build_run_id }}
          EXPECTED_ARTIFACT: ${{ steps.expected.outputs.EXPECTED_ARTIFACT }}
          EXPECTED_TAG: ${{ steps.expected.outputs.EXPECTED_TAG }}
        run: |
          set -euo pipefail
          if [[ -n "$INPUT_RUN_ID" ]]; then
            if [[ ! "$INPUT_RUN_ID" =~ ^[0-9]+$ ]]; then
              echo 'build_run_id must be a numeric Actions run ID.' >&2
              exit 1
            fi
            RUNS=("$INPUT_RUN_ID")
          else
            mapfile -t RUNS < <(gh run list -R "$REPO" \
              --workflow build-and-package.yml --status success --limit 50 \
              --json databaseId --jq '.[].databaseId')
          fi
          SELECTED_RUN=''
          for RUN_ID in "${RUNS[@]}"; do
            [[ -n "$RUN_ID" ]] || continue
            STATE="$(gh run view "$RUN_ID" -R "$REPO" --json conclusion --jq '.conclusion')"
            if [[ "$STATE" != success ]]; then
              if [[ -n "$INPUT_RUN_ID" ]]; then
                echo "Build run $RUN_ID is $STATE, not success." >&2
                exit 1
              fi
              continue
            fi
            mapfile -t MATCHES < <(gh api -H 'Accept: application/vnd.github+json' \
              "repos/$REPO/actions/runs/$RUN_ID/artifacts" --paginate \
              --jq '.artifacts[] | select(.expired == false) | .name' \
              | grep -Fx "$EXPECTED_ARTIFACT" || true)
            if [[ ${#MATCHES[@]} -eq 1 ]]; then
              SELECTED_RUN="$RUN_ID"
              break
            fi
            if [[ -n "$INPUT_RUN_ID" ]]; then
              echo "Run $RUN_ID has no unexpired artifact named $EXPECTED_ARTIFACT." >&2
              exit 1
            fi
          done
          if [[ -z "$SELECTED_RUN" ]]; then
            echo "No successful build with artifact $EXPECTED_ARTIFACT was found." >&2
            echo "Run 'Build native Composer plugin' for $EXPECTED_TAG first, then publish." >&2
            echo 'If necessary, supply the successful build_run_id explicitly.' >&2
            exit 1
          fi
          mkdir -p downloaded
          gh run download "$SELECTED_RUN" -R "$REPO" \
            --name "$EXPECTED_ARTIFACT" --dir downloaded
          mapfile -d '' -t X64_ZIPS < <(find downloaded -type f \
            -name '*-linux-x64-install.zip' -print0)
          if [[ ${#X64_ZIPS[@]} -ne 1 ]]; then
            printf 'Expected one Linux x64 installation ZIP; found %d\n' "${#X64_ZIPS[@]}" >&2
            exit 1
          fi
          echo "archive=${X64_ZIPS[0]}" >> "$GITHUB_OUTPUT"
          echo "build_run_id=$SELECTED_RUN" >> "$GITHUB_OUTPUT"
          echo "Selected matching $EXPECTED_ARTIFACT from successful build $SELECTED_RUN"

      - name: Validate compiled Linux x64 ZIP and exact version
        id: meta
        shell: bash
        env:
          EXPECTED_TAG: ${{ steps.expected.outputs.EXPECTED_TAG }}
          ARCHIVE: ${{ steps.fetch.outputs.archive }}
        run: |
          set -euo pipefail
          python3 tools/prepare_x64_release.py --archive "$ARCHIVE" \
            --release-tag "$EXPECTED_TAG" --github-output "$GITHUB_OUTPUT" --apply

      - name: Create or verify public GitHub Release asset
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          TAG: ${{ steps.meta.outputs.RELEASE_TAG }}
          ASSET_NAME: ${{ steps.meta.outputs.ASSET_NAME }}
          SOURCE_SHA: ${{ steps.meta.outputs.ASSET_SHA256 }}
          ARCHIVE: ${{ steps.fetch.outputs.archive }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" -R "$REPO" >/dev/null 2>&1; then
            echo "GitHub Release $TAG exists; verifying asset."
          else
            gh release create "$TAG" "$ARCHIVE" -R "$REPO" --target "$DEFAULT_BRANCH" \
              --title "Composer Shared Metadata $TAG (Linux x64)" \
              --notes 'Compiled Jellyfin 12.2 Composer Shared Metadata plugin. Linux x64 only.'
          fi
          mapfile -t MATCHING_ASSETS < <(gh release view "$TAG" -R "$REPO" \
            --json assets --jq '.assets[].name' | grep -Fx "$ASSET_NAME" || true)
          if [[ ${#MATCHING_ASSETS[@]} -eq 0 ]]; then
            gh release upload "$TAG" "$ARCHIVE" -R "$REPO"
          elif [[ ${#MATCHING_ASSETS[@]} -gt 1 ]]; then
            echo 'Duplicate release asset names; refusing to choose arbitrarily.' >&2
            exit 1
          fi
          mkdir -p verified-release
          gh release download "$TAG" -R "$REPO" --pattern "$ASSET_NAME" --dir verified-release
          test -f "verified-release/$ASSET_NAME"
          DOWNLOADED_SHA="$(sha256sum "verified-release/$ASSET_NAME" | cut -d ' ' -f 1)"
          if [[ "$DOWNLOADED_SHA" != "$SOURCE_SHA" ]]; then
            echo "Release $TAG already holds a different ZIP called $ASSET_NAME; refusing to overwrite it." >&2
            exit 1
          fi
          echo "Verified GitHub Release $TAG asset $ASSET_NAME (SHA256 $SOURCE_SHA)"

      - name: Generate Jellyfin manifest from verified release ZIP
        shell: bash
        env:
          REPO: ${{ github.repository }}
          TAG: ${{ steps.meta.outputs.RELEASE_TAG }}
          ASSET_NAME: ${{ steps.meta.outputs.ASSET_NAME }}
        run: |
          set -euo pipefail
          python3 tools/make_plugin_manifest.py \
            --archive "verified-release/$ASSET_NAME" --repo "$REPO" \
            --tag "$TAG" --manifest manifest.json --apply
          python3 -m json.tool manifest.json >/dev/null
          python3 - <<'PYVALIDATE'
          import json
          from pathlib import Path
          records = json.loads(Path('manifest.json').read_text())
          assert len([r for r in records if r.get('guid') == '4c65902b-e89d-4549-a313-2a204c622e77']) == 1
          PYVALIDATE

      - name: Commit manifest on default branch (if changed)
        shell: bash
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          TAG: ${{ steps.meta.outputs.RELEASE_TAG }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add manifest.json
          if git diff --cached --quiet; then
            echo 'Manifest is already current.'
          else
            git commit -m "Publish Linux x64 Composer catalog entry for $TAG"
            git push origin "HEAD:$DEFAULT_BRANCH"
          fi

      - name: Show installation URL
        shell: bash
        env:
          REPO: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          TAG: ${{ steps.meta.outputs.RELEASE_TAG }}
          BUILD_RUN_ID: ${{ steps.fetch.outputs.build_run_id }}
        run: |
          echo "### Composer Shared Metadata Linux x64 Release" >> "$GITHUB_STEP_SUMMARY"
          echo "- Build run: $BUILD_RUN_ID" >> "$GITHUB_STEP_SUMMARY"
          echo "- GitHub Release: https://github.com/$REPO/releases/tag/$TAG" >> "$GITHUB_STEP_SUMMARY"
          echo "- Jellyfin repository URL: https://raw.githubusercontent.com/$REPO/$DEFAULT_BRANCH/manifest.json" >> "$GITHUB_STEP_SUMMARY"
          echo '- Only the Linux x64 build is published; no ARM64 asset is added by this workflow.' >> "$GITHUB_STEP_SUMMARY"
