# Composer Shared Metadata Repository Publisher v1.0.1
# Purpose: From a successful native-build Actions artifact, publish ONLY the
#          compiled Linux x64 installation ZIP as a public GitHub Release asset,
#          then create/update Jellyfin's manifest.json on the default branch.
# Safety: workflow_dispatch only; no changes to Jellyfin database, plugin
#         binaries, running containers, or browser metadata. Refuses accidental
#         replacement of a different release binary of the same name.
# Requirements: successful Build native Composer plugin workflow, GitHub Actions
#               GITHUB_TOKEN with contents:write and actions:read permissions.
# Inputs: optional build_run_id; optional release_tag (must match compiled ZIP).
# Never treats Actions artifacts as publicly accessible Jellyfin Release URLs.
name: Publish Composer repository manifest

on:
  workflow_dispatch:
    inputs:
      build_run_id:
        description: 'Successful Build native Composer plugin run ID (blank = latest successful run)'
        required: false
        type: string
      release_tag:
        description: 'Optional release tag (blank = derive from compiled Linux x64 ZIP)'
        required: false
        type: string

permissions:
  actions: read
  contents: write

concurrency:
  group: composer-linux-x64-catalog
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out default branch
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Find and download successful compiled build artifact
        id: fetch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BUILD_RUN_ID: ${{ inputs.build_run_id }}
        run: |
          set -euo pipefail
          RUN_ID="$BUILD_RUN_ID"
          if [[ -z "$RUN_ID" ]]; then
            RUN_ID="$(gh run list -R "$REPO" --workflow build-and-package.yml --status success \
              --limit 1 --json databaseId --jq '.[0].databaseId // empty')"
          fi
          if [[ -z "$RUN_ID" ]]; then
            echo 'No successful native plugin build run found. Run Build native Composer plugin first.' >&2
            exit 1
          fi
          STATE="$(gh run view "$RUN_ID" -R "$REPO" --json conclusion --jq '.conclusion')"
          if [[ "$STATE" != success ]]; then
            echo "Run $RUN_ID is $STATE; only successful builds may be published." >&2
            exit 1
          fi
          mapfile -t MATCHES < <(gh api -H 'Accept: application/vnd.github+json' \
            "repos/$REPO/actions/runs/$RUN_ID/artifacts" \
            --paginate --jq '.artifacts[] | select(.expired == false) | .name' \
            | grep '^jellyfin-composer-plugin-' || true)
          if [[ ${#MATCHES[@]} -ne 1 ]]; then
            printf 'Expected exactly one plugin build artifact; found %d: %s\n' "${#MATCHES[@]}" "${MATCHES[*]}" >&2
            exit 1
          fi
          mkdir -p downloaded
          gh run download "$RUN_ID" -R "$REPO" --name "${MATCHES[0]}" --dir downloaded
          mapfile -d '' -t X64_ZIPS < <(find downloaded -type f -name '*-linux-x64-install.zip' -print0)
          if [[ ${#X64_ZIPS[@]} -ne 1 ]]; then
            printf 'Expected exactly one compiled Linux x64 install ZIP; found %d\n' "${#X64_ZIPS[@]}" >&2
            exit 1
          fi
          echo "archive=${X64_ZIPS[0]}" >> "$GITHUB_OUTPUT"
          echo "Build run $RUN_ID: Linux x64 installation archive ${X64_ZIPS[0]}"

      - name: Validate Linux x64 plugin ZIP and derive release tag
        id: meta
        shell: bash
        env:
          INPUT_TAG: ${{ inputs.release_tag }}
          ARCHIVE: ${{ steps.fetch.outputs.archive }}
        run: |
          set -euo pipefail
          python3 tools/prepare_x64_release.py --archive "$ARCHIVE" \
            --release-tag "$INPUT_TAG" --github-output "$GITHUB_OUTPUT" --apply

      - name: Create or verify public GitHub Release asset
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          TAG: ${{ steps.meta.outputs.RELEASE_TAG }}
          ASSET_NAME: ${{ steps.meta.outputs.ASSET_NAME }}
          SOURCE_SHA: ${{ steps.meta.outputs.ASSET_SHA256 }}
          ARCHIVE: ${{ steps.fetch.outputs.archive }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" -R "$REPO" >/dev/null 2>&1; then
            echo "GitHub Release $TAG exists; verifying asset."
          else
            gh release create "$TAG" "$ARCHIVE" -R "$REPO" --target "$DEFAULT_BRANCH" \
              --title "Composer Shared Metadata $TAG (Linux x64)" \
              --notes 'Compiled Jellyfin 12.2 Composer Shared Metadata plugin. Linux x64 only.'
          fi
          mapfile -t MATCHING_ASSETS < <(gh release view "$TAG" -R "$REPO" \
            --json assets --jq '.assets[].name' | grep -Fx "$ASSET_NAME" || true)
          if [[ ${#MATCHING_ASSETS[@]} -eq 0 ]]; then
            gh release upload "$TAG" "$ARCHIVE" -R "$REPO"
          elif [[ ${#MATCHING_ASSETS[@]} -gt 1 ]]; then
            echo 'Duplicate release asset names; refusing to choose arbitrarily.' >&2
            exit 1
          fi
          mkdir -p verified-release
          gh release download "$TAG" -R "$REPO" --pattern "$ASSET_NAME" --dir verified-release
          test -f "verified-release/$ASSET_NAME"
          DOWNLOADED_SHA="$(sha256sum "verified-release/$ASSET_NAME" | cut -d ' ' -f 1)"
          if [[ "$DOWNLOADED_SHA" != "$SOURCE_SHA" ]]; then
            echo "Release $TAG already holds a different ZIP called $ASSET_NAME; refusing to overwrite it." >&2
            exit 1
          fi
          echo "Verified GitHub Release $TAG asset $ASSET_NAME (SHA256 $SOURCE_SHA)"

      - name: Generate Jellyfin manifest from verified release ZIP
        shell: bash
        env:
          REPO: ${{ github.repository }}
          TAG: ${{ steps.meta.outputs.RELEASE_TAG }}
          ASSET_NAME: ${{ steps.meta.outputs.ASSET_NAME }}
        run: |
          set -euo pipefail
          python3 tools/make_plugin_manifest.py \
            --archive "verified-release/$ASSET_NAME" --repo "$REPO" \
            --tag "$TAG" --manifest manifest.json --apply
          python3 -m json.tool manifest.json >/dev/null
          python3 - <<'PY'
          import json
          from pathlib import Path
          p = json.loads(Path('manifest.json').read_text())
          assert len([r for r in p if r.get('guid') == '4c65902b-e89d-4549-a313-2a204c622e77']) == 1
          PY

      - name: Commit manifest on default branch (if changed)
        shell: bash
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          TAG: ${{ steps.meta.outputs.RELEASE_TAG }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add manifest.json
          if git diff --cached --quiet; then
            echo 'Manifest is already current.'
          else
            git commit -m "Publish Linux x64 Composer catalog entry for $TAG"
            git push origin "HEAD:$DEFAULT_BRANCH"
          fi

      - name: Show installation URL
        shell: bash
        env:
          REPO: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          TAG: ${{ steps.meta.outputs.RELEASE_TAG }}
        run: |
          echo "### Composer Shared Metadata Linux x64 Release" >> "$GITHUB_STEP_SUMMARY"
          echo "- GitHub Release: https://github.com/$REPO/releases/tag/$TAG" >> "$GITHUB_STEP_SUMMARY"
          echo "- Jellyfin repository URL: https://raw.githubusercontent.com/$REPO/$DEFAULT_BRANCH/manifest.json" >> "$GITHUB_STEP_SUMMARY"
          echo '- Only the Linux x64 build is published; no ARM64 asset is added by this workflow.' >> "$GITHUB_STEP_SUMMARY"
