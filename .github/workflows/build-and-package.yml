# Composer plugin build v1.0.4 — version-consistent Jellyfin 12.2 Linux x64 archives.
# Runs on explicit workflow_dispatch, code push, or v* tag. No Jellyfin DB access.
# Only build runner downloads .NET SDK and NuGet; no SDK needed on Jellyfin server.
name: Build native Composer plugin
on:
  workflow_dispatch:
  push:
    branches: [main, master]
    tags: ["v*"]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Resolve plugin version from checked-out C# project
        id: version
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/select_composer_build.py --project plugin/Jellyfin.Plugin.ComposerSharedMetadata.csproj --github-output "$GITHUB_OUTPUT" --apply
      - name: Verify current source and documentation
        run: python3 tests/preflight_source.py --version "${{ steps.version.outputs.EXPECTED_VERSION }}"
      - name: Restore and build against Jellyfin 12.2
        run: dotnet build plugin/Jellyfin.Plugin.ComposerSharedMetadata.csproj --configuration Release
      - name: Test SQLite store using separate temp DB
        run: dotnet run --project tests/StoreSmoke.csproj --configuration Release
      - name: Verify logging coverage and privacy invariants
        run: python3 -m unittest discover -s tests -p test_logging.py -v
      - name: Test the Composer Browser
        run: |
          node --check web/jellyfin_composers_api_browser_v3_7_2.js
          node tests/test_composer_api_v3_7_2.js
      - name: Publish Linux x64 plugin libraries
        run: |
          dotnet publish plugin/Jellyfin.Plugin.ComposerSharedMetadata.csproj --configuration Release -r linux-x64 --self-contained false --output out/linux-x64
      - name: Verify actual published SQLite and plugin assembly versions
        run: >-
          dotnet run --project tests/VerifyPublishedAssemblies.csproj
          --configuration Release -- out/linux-x64 "${{ steps.version.outputs.EXPECTED_VERSION }}"
      - name: Assemble platform-specific install ZIPs
        run: |
          python3 packaging/package_release.py --publish-dir out/linux-x64 --rid linux-x64 --expected-version "${{ steps.version.outputs.EXPECTED_VERSION }}" --apply
          (cd dist && sha256sum *.zip > SHA256SUMS.txt)
      - name: Validate compiled ZIP version before publishing artifact
        shell: bash
        env:
          EXPECTED_VERSION: ${{ steps.version.outputs.EXPECTED_VERSION }}
          EXPECTED_TAG: ${{ steps.version.outputs.EXPECTED_TAG }}
        run: |
          set -euo pipefail
          ZIP="dist/jellyfin-composer-shared-metadata-${EXPECTED_VERSION}-linux-x64-install.zip"
          test -f "$ZIP" || { echo "Missing expected archive $ZIP" >&2; exit 1; }
          python3 tools/prepare_x64_release.py --archive "$ZIP" --release-tag "$EXPECTED_TAG"
          python3 tools/verify_composer_install_zip.py --archive "$ZIP" --expected-version "$EXPECTED_VERSION" --strict
      - name: Upload built install ZIPs
        uses: actions/upload-artifact@v6
        with:
          name: ${{ steps.version.outputs.EXPECTED_ARTIFACT }}
          path: dist/*
          if-no-files-found: error
      # GitHub Release publication is handled only by publish-composer-manifest.yml,
      # after the archive version is verified. No automatic tag publication here.
